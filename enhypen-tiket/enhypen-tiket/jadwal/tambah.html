<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Jadwal — ENHYPEN Tickets</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-bar">
    <a href="../index.html" class="brand">
      <span class="brand-badge">EN</span>
      <span class="brand-text">ENHYPEN<small>tiket konser</small></span>
    </a>
    <button type="button" class="nav-toggle" aria-label="Buka menu" aria-expanded="false"><span></span></button>
    <nav class="main-nav">
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="../jadwal/list.html" class="active">Jadwal Tur</a></li>
        <li><a href="../pesanan/list.html">Pesanan</a></li>
        <li><a href="../pesanan/tambah.html">Pesan Tiket</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">
  <section class="section">
    <div class="section-head section-head-center">
      <h2>Tambah Jadwal Tur</h2>
      <p>Validasi berjalan di browser. Data belum disimpan ke server.</p>
    </div>
    <form class="order-card" id="form-tambah" data-validasi>
      <div class="form-row">
        <label for="tanggal">Tanggal Konser</label>
        <input type="date" id="tanggal" name="tanggal" data-label="Tanggal" min="2026-01-01" max="2026-12-31" required>
      </div>
      <div class="form-row">
        <label for="kota">Kota</label>
        <input type="text" id="kota" name="kota" data-label="Kota" placeholder="Contoh: Jakarta, Indonesia" required>
      </div>
      <div class="form-row">
        <label for="venue">Venue</label>
        <input type="text" id="venue" name="venue" data-label="Venue" placeholder="Nama stadion / arena" required>
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label for="kapasitas">Kapasitas</label>
          <input type="number" id="kapasitas" name="kapasitas" data-label="Kapasitas" min="1" required>
        </div>
        <div class="form-row">
          <label for="harga">Harga Mulai (Rp)</label>
          <input type="number" id="harga" name="harga" data-label="Harga" min="0" required>
        </div>
      </div>
      <div class="form-row">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option>Tiket Tersedia</option>
          <option>Segera Dibuka</option>
          <option>Habis Terjual</option>
        </select>
      </div>
      <button type="submit" class="btn btn-block">Simpan Jadwal</button>
    </form>
  </section>
</main>

<footer class="site-footer">
  <p>Sistem Pemesanan Tiket Konser &mdash; Jobsheet 6: Fetch API &amp; JSON</p>
</footer>

<script src="../assets/js/app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesan Tiket — ENHYPEN Tickets</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-bar">
    <a href="index.html" class="brand">
      <span class="brand-badge">EN</span>
      <span class="brand-text">ENHYPEN<small>tiket konser</small></span>
    </a>

    <button type="button" class="nav-toggle" aria-label="Buka menu" aria-expanded="false"><span></span></button>

    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="jadwal.html">Jadwal Tur</a></li>
        <li><a href="pesanan.html" class="active">Pesan Tiket</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">

  <section class="section">
    <div class="section-head section-head-center">
      <h2>Formulir Pemesanan</h2>
      <p>Isi data berikut untuk memesan tiket. Validasi berjalan di browser, belum diproses server.</p>
    </div>

    <form class="order-card" id="form-pesan" data-validasi>
      <div class="form-row">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" data-label="Nama lengkap" placeholder="Nama sesuai KTP" required>
      </div>

      <div class="form-grid-2">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" data-label="Email" placeholder="nama@email.com" required>
        </div>
        <div class="form-row">
          <label for="telepon">No. WhatsApp</label>
          <input type="tel" id="telepon" name="telepon" data-label="No. WhatsApp" placeholder="08xx-xxxx-xxxx" required>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-row">
          <label for="kota">Kota Konser</label>
          <select id="kota" name="kota">
            <option>Jakarta, Indonesia</option>
            <option>Bangkok, Thailand</option>
            <option>Manila, Filipina</option>
            <option>Singapura</option>
            <option>Kuala Lumpur, Malaysia</option>
            <option>Ho Chi Minh City, Vietnam</option>
            <option>Taipei, Taiwan</option>
          </select>
        </div>
        <div class="form-row">
          <label for="kategori">Kategori Tiket</label>
          <select id="kategori" name="kategori">
            <option>VIP A &amp; B &mdash; Rp 3.650.000</option>
            <option>CAT 1 &mdash; Rp 3.450.000</option>
            <option>CAT 2 A, B &amp; C &mdash; Rp 3.250.000</option>
            <option>CAT 3 &mdash; Rp 2.950.000</option>
            <option>CAT 4 &mdash; Rp 2.750.000</option>
            <option>CAT 5 &mdash; Rp 2.250.000</option>
            <option>CAT 6 A &amp; B &mdash; Rp 1.850.000</option>
            <option>CAT 7 A &amp; B &mdash; Rp 1.450.000</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label for="jumlah">Jumlah Tiket (1–4)</label>
        <input type="number" id="jumlah" name="jumlah" data-label="Jumlah tiket" min="1" max="4" required>
      </div>

      <button type="submit" class="btn btn-block">Lanjutkan Pemesanan</button>
    </form>
  </section>

</main>

<footer class="site-footer">
  <p>Validasi server-side akan ditambahkan pada Jobsheet 7.</p>
</footer>

<script src="assets/js/app.js" defer></script>
</body>
</html>
